plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.charron'
version = '0.0.1-SNAPSHOT'
description = 'api'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
	implementation 'org.apache.commons:commons-csv:1.14.1'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
}


tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('swagger') {
	group = 'application'
	description = 'Start CHARRON API with Swagger UI'
	dependsOn 'bootRun'
}

tasks.named('bootRun') {
	def envFile = rootProject.file('../../infrastructure/.env')

	if (envFile.exists()) {
		envFile.eachLine { line ->
			def trimmed = line.trim()

			if (trimmed && !trimmed.startsWith('#')) {
				def parts = trimmed.split('=', 2)

				if (parts.length == 2) {
					environment parts[0].trim(), parts[1].trim()
				}
			}
		}
	}
}


tasks.named('test') {

	useJUnitPlatform()

	// Remove inherited CHARRON and Spring configuration.
	setEnvironment(
			System.getenv().findAll { key, value ->
				!key.startsWith('CHARRON_') &&
						!key.startsWith('SPRING_') &&
						!key.startsWith('VPIC_') &&
						!key.startsWith('PG') &&
						!(key in [
								'JAVA_TOOL_OPTIONS',
								'JDK_JAVA_OPTIONS',
								'_JAVA_OPTIONS'
						])
			}
	)

	// Dedicated disposable PostgreSQL instance.
	environment 'CHARRON_DB_URL',
			'jdbc:postgresql://127.0.0.1:5435/charron_test'

	environment 'CHARRON_DB_USER',
			'charron_test'

	environment 'CHARRON_DB_PASSWORD',
			'charron_test_only'

	environment 'CHARRON_VPIC_ENABLED',
			'true'

	environment 'VPIC_JDBC_URL',
			'jdbc:postgresql://127.0.0.1:5436/vpic_test'

	environment 'VPIC_DB_USERNAME',
			'vpic_test_reader'

	environment 'VPIC_DB_PASSWORD',
			'vpic_test_reader_only'

	systemProperty 'spring.profiles.active', 'test'

	systemProperty 'spring.datasource.url',
			'jdbc:postgresql://127.0.0.1:5435/charron_test'

	systemProperty 'spring.datasource.username',
			'charron_test'

	systemProperty 'spring.datasource.password',
			'charron_test_only'

	systemProperty 'charron.vpic.enabled', 'true'

	systemProperty 'VPIC_JDBC_URL',
			'jdbc:postgresql://127.0.0.1:5436/vpic_test'

	systemProperty 'VPIC_DB_USERNAME',
			'vpic_test_reader'

	systemProperty 'VPIC_DB_PASSWORD',
			'vpic_test_reader_only'

	// Flyway must use the same isolated database.
	systemProperty 'spring.flyway.url',
			'jdbc:postgresql://127.0.0.1:5435/charron_test'

	systemProperty 'spring.flyway.user',
			'charron_test'

	systemProperty 'spring.flyway.password',
			'charron_test_only'
}

def webDirectory = rootProject.file('../../apps/web')

def nodeDirectory = {
	def nvmDirectory = System.getenv('NVM_DIR') ?:
			"${System.getProperty('user.home')}/.nvm"

	def nodeVersion = 'v22.21.1'

	return file("${nvmDirectory}/versions/node/${nodeVersion}/bin")
}

tasks.register('webDev', Exec) {
	group = 'charron'
	description = 'Start the Svelte development server'

	workingDir webDirectory

	def nodeBin = nodeDirectory()
	environment 'PATH',
			"${nodeBin}:${System.getenv('PATH')}"

	commandLine "${nodeBin}/npm", 'run', 'dev'
}

tasks.register('webBuild', Exec) {
	group = 'charron'
	description = 'Build the Svelte frontend'

	workingDir webDirectory

	def nodeBin = nodeDirectory()
	environment 'PATH',
			"${nodeBin}:${System.getenv('PATH')}"

	commandLine "${nodeBin}/npm", 'run', 'build'
}

tasks.register('dev', Exec) {
	group = 'charron'
	description = 'Start the complete CHARRON development environment'

	workingDir rootProject.file('../..')

	commandLine 'bash', 'scripts/dev.sh'
}

