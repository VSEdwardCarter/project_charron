spring.application.name=api-test

# Dedicated disposable operational database.
spring.datasource.url=jdbc:postgresql://127.0.0.1:5435/charron_test
spring.datasource.username=charron_test
spring.datasource.password=charron_test_only

# Flyway must use the isolated operational database.
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://127.0.0.1:5435/charron_test
spring.flyway.user=charron_test
spring.flyway.password=charron_test_only

# Isolated vPIC reference database.
charron.vpic.enabled=true
charron.vpic.dataset-version=test

VPIC_JDBC_URL=jdbc:postgresql://127.0.0.1:5436/vpic_test
VPIC_DB_USERNAME=vpic_test_reader
VPIC_DB_PASSWORD=vpic_test_reader_only