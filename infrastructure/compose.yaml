
services:
  postgres:
    image: postgres:16
    container_name: charron-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${CHARRON_DB_NAME}
      POSTGRES_USER: ${CHARRON_DB_USER}
      POSTGRES_PASSWORD: ${CHARRON_DB_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - charron_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  charron_postgres_data:
